# DEMO: ImagePullBackOff - the backend image tag does not exist in GHCR.
# Symptom:  kubectl get pods -n clinicq  ->  STATUS ImagePullBackOff / ErrImagePull
# Debug:    kubectl describe pod -n clinicq -l app=clinicq-broken-image
#           kubectl get events -n clinicq --sort-by=.lastTimestamp
#           (look for "Failed to pull image ... manifest unknown")
# Fix:      retag an existing image (kubectl set image ...) or fix the tag
#           and redeploy with the correct SHA from the CI build-scan-push logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicq-broken-image
  namespace: clinicq
  labels:
    app: clinicq-broken-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinicq-broken-image
  template:
    metadata:
      labels:
        app: clinicq-broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/mehul01-max/clinicq-backend:tag-that-does-not-exist
          ports:
            - containerPort: 8000
