# Single ingress-nginx entrypoint: "/" serves the React SPA,
# "/api" routes to the FastAPI backend. Order matters - the /api
# rule must come first so API calls are not swallowed by the SPA.
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clinicq.fullname" . }}
  labels:
    {{- include "clinicq.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "clinicq.fullname" . }}-backend
                port:
                  number: 8000
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "clinicq.fullname" . }}-frontend
                port:
                  number: 8080
{{- end }}
