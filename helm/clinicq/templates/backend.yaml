apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clinicq.fullname" . }}-backend
  labels:
    {{- include "clinicq.labels" . | nindent 4 }}
    app: clinicq-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: clinicq-backend
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: clinicq-backend
        release: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "clinicq.fullname" . }}-config
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicq.fullname" . }}-backend
  labels:
    {{- include "clinicq.labels" . | nindent 4 }}
    app: clinicq-backend
spec:
  type: ClusterIP
  selector:
    app: clinicq-backend
    release: {{ .Release.Name }}
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
