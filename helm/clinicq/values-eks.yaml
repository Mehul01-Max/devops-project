# AWS EKS deployment: pulls scanned images from GHCR, ingress via the
# ingress-nginx controller (AWS NLB), EBS gp3 volume for PostgreSQL data.
backend:
  image: ghcr.io/mehul01-max/clinicq-backend
  tag: latest
  replicas: 2

frontend:
  image: ghcr.io/mehul01-max/clinicq-frontend
  tag: latest
  replicas: 2

ingress:
  enabled: true
  host: clinicq.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

postgres:
  # EBS CSI driver provisions this dynamically on EKS.
  storageClassName: gp3
